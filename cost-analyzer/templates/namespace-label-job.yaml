{{- if and .Values.global.platforms.openshift.enabled .Values.global.platforms.openshift.addOpenshiftMonitoringLabelToNamespace }}
apiVersion: batch/v1
kind: Job
metadata:
  name: label-ns
  namespace: {{ .Release.Namespace }}
  labels:
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    helm.sh/hook: post-install
    helm.sh/hook-delete-policy: hook-succeeded
spec:
  template:
    spec:
      containers:
      - name: labeler
        image: bitnami/kubectl:latest
        command:
        - kubectl
        - label
        - ns
        - {{ .Release.Namespace }}
        - openshift.io/cluster-monitoring=true
      restartPolicy: Never
      serviceAccountName: {{ template "cost-analyzer.serviceAccountName" . }}
{{- end }}